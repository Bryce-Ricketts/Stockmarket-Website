<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stockmarket+ The new home of simple stocks</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=IBM+Plex+Serif:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/c8c362ad31.js" crossorigin="anonymous"></script>
</head>
<body>
    <header class="stock-header">
        <div class="header-flex">
            <h1><i class="fa-solid fa-arrow-trend-up"></i>Stockmarket+</h1>
            <div class="header-summary">
                <div class="header-portfolio">
                    <h2>Portfolio Value</h2>
                    <div id="dynamic-value">
                        
                    </div>
                </div>
                <div class="header-stockcount">
                    <h2>Stocks Owned:</h2>
                    <div id="dynamic-stocks">

                    </div>
                </div>
            </div>
        </div>
    </header>
    <main>
        <div id="search-master">
            <div id="search">
            <input type="text" name="search" id="stock-search">
            <button id="search-button">Search Stocks</button>
            <!-- We want to stock you have searched for to appear here -->
            </div>
            <div id="result">

            </div>
            <div id="date-box">
                <h3 class="date">Last updated:</h3>
                <div id="last-date">

                </div>
            </div>
        </div>

        <div id="watchlist">
            <div id="watchlist-header">
                <h3><i class="fa-solid fa-bars"></i></h3>
                <button>Refresh Prices</button>
            </div>
            <div id="watchlist-section">
                <!-- This is where the stocks you are watching will appear -->
            </div>
        </div>

        <div id="summary">
            <div id="summary-header">
                <h3 id="summary-icon"><i class="fa-solid fa-basket-shopping"></i></h3>
                <button>Export Data</button>
            </div>
            <div class="portfolio-below">
                <!-- This is where the summary for your portfolio price, stocks owned ect will show -->
                <div id="summary-section">

                </div>
                <div>
                    
                </div>
            </div>
        </div>
    </main>
    <footer>

    </footer>
    <script src="stocks.js"></script>
</body>
</html>
